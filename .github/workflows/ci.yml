# Checks the plugin on GitHub's machines. Open the "Actions" tab of this repository to see the result.
#
# Without Unity (every push): the .meta files, the package's consistency, the Java bridge, the C# tests on .NET, the
# .unitypackage. With Unity (GameCI), once the repository has the secrets UNITY_LICENSE, UNITY_EMAIL and
# UNITY_PASSWORD (README → "The Unity licence"): the tests in Unity, the demo built for Android (Next-Gen and Google
# Mobile Ads 25.x) and for iOS, and the iOS project compiled with Xcode. Without the secrets those jobs are skipped.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  UNITY_VERSION: 6000.0.86f1

jobs:
  checks:
    name: Package, Java bridge and C# tests (no Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every file of the package has its .meta
        run: python3 ci/metas.py --check
      - name: Versions, changelogs and the bridges agree
        run: python3 ci/check_package.py
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: The Android bridge compiles (against the SDK's API)
        run: sh ci/java/check.sh
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: The C# layer's tests, on .NET
        run: dotnet test ci/dotnet --logger "console;verbosity=normal"
      - name: The .unitypackage
        run: |
          python3 ci/unitypackage.py build
          tar -tzf build/VisionForgeX-*.unitypackage | grep -c pathname
      - uses: actions/upload-artifact@v4
        with: { name: unitypackage, path: build/*.unitypackage }

  licence:
    name: Unity licence present?
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.check.outputs.has }}
    steps:
      - id: check
        env:
          L: ${{ secrets.UNITY_LICENSE }}
          E: ${{ secrets.UNITY_EMAIL }}
          P: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$L" ] && [ -n "$E" ] && [ -n "$P" ]; then echo "has=true" >> "$GITHUB_OUTPUT"
          else echo "has=false" >> "$GITHUB_OUTPUT"; echo "::notice::No Unity licence secrets yet: the Unity jobs are skipped (README → The Unity licence)."; fi

  unity-tests:
    name: Tests in Unity (EditMode)
    needs: [checks, licence]
    if: needs.licence.outputs.has == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The demo, as a game imports it (so it compiles too)
        run: mkdir -p Assets/Samples/VisionForgeX && cp -R "Packages/com.visionforgex.ads/Samples~/Demo" Assets/Samples/VisionForgeX/Demo
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/**', 'Assets/**') }}
          restore-keys: Library-tests-${{ env.UNITY_VERSION }}-
      # Pinned: unity-test-runner 4.4.0 (Sep 2026) moved licence activation into game-ci/cli, which a free Personal
      # licence fails with "Code 400 TimeStamp validation failed". 4.3.2 is the maintainers' backport of the old path.
      - uses: game-ci/unity-test-runner@v4.3.2
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode tests
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unity-test-results, path: "${{ steps.tests.outputs.artifactsPath }}" }

  android:
    name: Android build (${{ matrix.engine }})
    needs: [checks, licence]
    if: needs.licence.outputs.has == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        engine: [nextgen, gma]
    steps:
      - name: Room for Unity's Android image
        uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: false, android: true, dotnet: true, haskell: true, large-packages: false, docker-images: false, swap-storage: false }
      - uses: actions/checkout@v4
      - run: mkdir -p Assets/Samples/VisionForgeX && cp -R "Packages/com.visionforgex.ads/Samples~/Demo" Assets/Samples/VisionForgeX/Demo
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/**', 'Assets/**') }}
          restore-keys: Library-Android-${{ env.UNITY_VERSION }}-
      - uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: VfxCiBuild.Android
          customParameters: -vfxEngine ${{ matrix.engine }}
          buildName: VisionForgeXDemo
          versioning: None
          allowDirtyBuild: true
      - name: What the APK carries
        run: |
          ls -la build/Android
          APK=$(ls build/Android/*.apk | head -1)
          unzip -l "$APK" | grep -c "classes.*dex"
          unzip -p "$APK" 'classes*.dex' | grep -a -c "com/visionforgex/unity/VfxUnityBridge" || (echo "The bridge is not in the APK" && exit 1)
          unzip -p "$APK" 'classes*.dex' | grep -a -c "com/visionforgex/ads/VisionForgeX" || (echo "The VisionForgeX SDK is not in the APK" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.engine }}
          path: build/Android

  ios-project:
    name: iOS build (the Xcode project)
    needs: [checks, licence]
    if: needs.licence.outputs.has == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: false, android: true, dotnet: true, haskell: true, large-packages: false, docker-images: false, swap-storage: false }
      - uses: actions/checkout@v4
      - run: mkdir -p Assets/Samples/VisionForgeX && cp -R "Packages/com.visionforgex.ads/Samples~/Demo" Assets/Samples/VisionForgeX/Demo
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/**', 'Assets/**') }}
          restore-keys: Library-iOS-${{ env.UNITY_VERSION }}-
      - uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: VfxCiBuild.Ios
          buildName: VisionForgeXDemo
          versioning: None
          allowDirtyBuild: true
      - name: What the plugin wrote into the Xcode project
        run: |
          P=$(dirname "$(find build/iOS -name Podfile | head -1)")
          echo "Xcode project: $P"
          grep -n "VisionForgeX" "$P/Podfile"
          grep -q ":git => 'https://github.com/VisionForgeX/visionforgex-ios-sdk.git', :tag => '1.2.0'" "$P/Podfile"
          grep -A1 GADApplicationIdentifier "$P/Info.plist"
          grep -c "skadnetwork" "$P/Info.plist"
          tar -czf ios-project.tgz -C "$P" .
      - uses: actions/upload-artifact@v4
        with: { name: ios-project, path: ios-project.tgz }

  ios-xcode:
    name: iOS compile (Xcode, with the pods)
    needs: ios-project
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v4
        with: { name: ios-project }
      - run: mkdir proj && tar -xzf ios-project.tgz -C proj
      - name: pod install
        run: cd proj && pod install --repo-update
      - name: xcodebuild (device, no signing)
        run: |
          cd proj
          xcodebuild -version
          xcodebuild -workspace Unity-iPhone.xcworkspace -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet build

  release:
    name: Attach the .unitypackage to the release
    if: github.event_name == 'release'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the package's version
        run: |
          V=$(python3 -c "import json;print(json.load(open('Packages/com.visionforgex.ads/package.json'))['version'])")
          test "${{ github.event.release.tag_name }}" = "$V" || (echo "The release tag is not the package version $V" && exit 1)
      - run: python3 ci/unitypackage.py build
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release upload "${{ github.event.release.tag_name }}" build/*.unitypackage --clobber
